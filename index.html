<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Jesus Songs</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ============================================================
   THEME
============================================================ */

:root {
    --body-bg: #f7f3ee;
    --body-text: #222;

    --card-bg: #ffffff;
    --panel-bg: #ffffff;
    --modal-bg: #ffffff;

    --header-bg-1: #1a1a2e;
    --header-bg-2: #16213e;

    --header-text: #f5e6d3;

    --primary: #f0c040;
    --primary-dark: #b8860b;

    --title-color: #1a1a2e;
    --text-color: #222;
    --muted-text: #777;
    --preview-color: #555;

    --border-color: #eee;
    --soft-border: #f0ebe5;

    --input-bg: #ffffff;
    --input-text: #222;
    --input-border: #ddd;

    --link-color: #1a6fb5;

    --footer-bg: #1a1a2e;
    --footer-text: rgba(255,255,255,.4);

    --shadow: rgba(0,0,0,.08);
    --strong-shadow: rgba(0,0,0,.15);

    --overlay: rgba(0,0,0,.65);
}

body.dark-mode {
    --body-bg: #101114;
    --body-text: #eeeeee;

    --card-bg: #1b1d22;
    --panel-bg: #1b1d22;
    --modal-bg: #1b1d22;

    --header-bg-1: #08090d;
    --header-bg-2: #151923;

    --header-text: #f5e6d3;

    --title-color: #f5f5f5;
    --text-color: #eeeeee;
    --muted-text: #a8a8a8;
    --preview-color: #bdbdbd;

    --border-color: #30333b;
    --soft-border: #353841;

    --input-bg: #111318;
    --input-text: #eeeeee;
    --input-border: #3b3e47;

    --link-color: #5eb7ff;

    --footer-bg: #08090d;
    --footer-text: rgba(255,255,255,.55);

    --shadow: rgba(0,0,0,.35);
    --strong-shadow: rgba(0,0,0,.55);

    --overlay: rgba(0,0,0,.78);
}


/* ============================================================
   RESET
============================================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--body-bg);
    color: var(--body-text);
    min-height: 100vh;
    transition:
        background-color .3s ease,
        color .3s ease;
}


/* ============================================================
   HEADER
============================================================ */

.header {
    background:
        linear-gradient(
            135deg,
            var(--header-bg-1),
            var(--header-bg-2)
        );

    color: var(--header-text);

    padding: 1.2rem 2rem;

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;

    box-shadow: 0 4px 15px rgba(0,0,0,.3);

    position: sticky;
    top: 0;
    z-index: 100;

    transition: .3s;
}

.header h1 {
    font-size: 1.9rem;

    display: flex;
    align-items: center;

    gap: .5rem;
}

.header h1 i {
    color: var(--primary);
}

.header-controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}


/* ============================================================
   SEARCH
============================================================ */

.search-wrap {
    position: relative;
}

.search-wrap i {
    position: absolute;
    left: .8rem;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,.5);
}

#searchInput {
    padding: .5rem 1rem .5rem 2.2rem;

    border: none;
    border-radius: 30px;

    font-size: .95rem;

    background: rgba(255,255,255,.15);

    color: #fff;

    outline: 2px solid transparent;

    transition: .3s;

    min-width: 250px;
}

#searchInput::placeholder {
    color: rgba(255,255,255,.6);
}

#searchInput:focus {
    outline-color: var(--primary);
    background: rgba(255,255,255,.25);
}


/* ============================================================
   BUTTONS
============================================================ */

.btn {
    padding: .5rem 1.2rem;

    border: none;
    border-radius: 30px;

    font-weight: 600;
    font-size: .9rem;

    cursor: pointer;

    transition: .25s;

    background: var(--primary);

    color: #1a1a2e;
}

.btn:hover {
    transform: scale(1.03);
    opacity: .9;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

.btn-outline {
    background: transparent;

    border: 2px solid var(--primary);

    color: var(--primary);
}

.btn-outline:hover {
    background: var(--primary);
    color: #1a1a2e;
}

.btn-danger {
    background: #c0392b;
    color: #fff;
}

.btn-edit {
    background: #3498db;
    color: #fff;
}

.btn-edit:hover {
    background: #2980b9;
}

.btn-cancel {
    background: #777;
    color: #fff;
}


/* ============================================================
   THEME BUTTON
============================================================ */

#themeToggleBtn {
    min-width: 48px;
    height: 42px;

    padding: .5rem .9rem;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: .4rem;

    background: transparent;

    border: 2px solid var(--primary);

    color: var(--primary);

    border-radius: 30px;

    cursor: pointer;

    font-size: 1rem;

    transition: .25s;
}

#themeToggleBtn:hover {
    background: var(--primary);
    color: #1a1a2e;

    transform: scale(1.05);
}


/* ============================================================
   SONG COUNT
============================================================ */

.song-count {
    font-size: .9rem;
    color: rgba(255,255,255,.7);
}


/* ============================================================
   MAIN
============================================================ */

.main {
    max-width: 1200px;

    margin: 0 auto;

    padding: 2rem 1.5rem;

    transition: .3s;
}


/* ============================================================
   SONG GRID
============================================================ */

.songs-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(300px,1fr)
        );

    gap: 1.5rem;
}


/* ============================================================
   SONG CARD
============================================================ */

.song-card {
    background: var(--card-bg);

    border-radius: 16px;

    box-shadow:
        0 6px 20px var(--shadow);

    transition: .3s;

    border-left:
        5px solid var(--primary-dark);

    cursor: pointer;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    user-select: none;
}

.song-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 12px 30px var(--strong-shadow);
}

.song-card-header {
    padding: 1.2rem 1.5rem .5rem;
}

.song-title {
    font-size: 1.15rem;

    font-weight: 700;

    color: var(--title-color);
}

.song-title i {
    color: var(--primary-dark);
    margin-right: .4rem;
}

.song-card-body {
    padding: 0 1.5rem .8rem;
    flex: 1;
}

.song-preview {
    color: var(--preview-color);

    font-style: italic;

    font-size: .9rem;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.song-link {
    padding: 0 1.5rem .7rem;
}

.song-link a {
    color: var(--link-color);

    text-decoration: none;

    font-size: .9rem;
}

.song-link a:hover {
    text-decoration: underline;
}

.song-footer {
    padding: .7rem 1.5rem 1rem;

    border-top:
        1px solid var(--soft-border);

    display: flex;

    justify-content: space-between;

    font-size: .8rem;

    color: var(--muted-text);
}


/* ============================================================
   NO RESULTS
============================================================ */

.no-results {
    text-align: center;

    padding: 3rem;

    grid-column: 1 / -1;

    color: var(--muted-text);
}


/* ============================================================
   ADMIN
============================================================ */

.admin-panel {
    display: none;

    background: var(--panel-bg);

    color: var(--text-color);

    border-radius: 20px;

    box-shadow:
        0 8px 30px var(--shadow);

    padding: 2rem;

    margin-bottom: 2rem;

    transition: .3s;
}

.admin-panel.active {
    display: block;
}

.admin-panel h2 {
    margin-bottom: 1rem;
    color: var(--title-color);
}

.admin-panel h3 {
    color: var(--title-color);
}


/* ============================================================
   FORM
============================================================ */

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    font-weight: 600;

    display: block;

    margin-bottom: .3rem;

    color: var(--text-color);
}

.form-group input,
.form-group textarea {
    width: 100%;

    padding: .7rem 1rem;

    border:
        2px solid var(--input-border);

    border-radius: 8px;

    font-size: .95rem;

    font-family: inherit;

    background: var(--input-bg);

    color: var(--input-text);

    outline: none;

    transition: .25s;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(240,192,64,.12);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: var(--muted-text);
}

.form-group textarea {
    min-height: 140px;
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: .7rem;
    flex-wrap: wrap;
}

.status-message {
    margin-top: .8rem;

    font-size: .9rem;

    min-height: 1.2rem;
}


/* ============================================================
   ADMIN SONG LIST
============================================================ */

.admin-song-list {
    margin-top: 2rem;

    border-top:
        2px dashed var(--input-border);

    padding-top: 1.5rem;
}

.admin-song-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: .7rem 0;

    border-bottom:
        1px solid var(--border-color);

    color: var(--text-color);
}

.admin-song-item .actions {
    display: flex;

    gap: .5rem;

    flex-wrap: wrap;

    justify-content: flex-end;
}

.edit-badge {
    display: inline-block;

    margin-left: .5rem;

    padding: .2rem .55rem;

    border-radius: 12px;

    background: #eaf4ff;

    color: #2471a3;

    font-size: .72rem;

    font-weight: 700;
}


/* ============================================================
   LOGIN
============================================================ */

.login-overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: var(--overlay);

    backdrop-filter: blur(4px);

    z-index: 200;

    justify-content: center;
    align-items: center;
}

.login-overlay.active {
    display: flex;
}

.login-modal {
    background: var(--modal-bg);

    color: var(--text-color);

    padding: 2.5rem 2rem;

    border-radius: 24px;

    max-width: 380px;

    width: 90%;

    box-shadow:
        0 20px 50px var(--strong-shadow);

    text-align: center;

    transition: .3s;
}

.login-modal h2 {
    margin-bottom: 1.5rem;
    color: var(--title-color);
}

.login-modal input {
    width: 100%;

    padding: .7rem 1rem;

    margin-bottom: 1rem;

    border:
        2px solid var(--input-border);

    border-radius: 8px;

    font-size: 1rem;

    background: var(--input-bg);

    color: var(--input-text);

    outline: none;
}

.login-modal input:focus {
    border-color: var(--primary);
}

.login-modal input::placeholder {
    color: var(--muted-text);
}

.login-modal .btn {
    width: 100%;
    padding: .7rem;
}

.login-error {
    color: #e74c3c;

    font-size: .9rem;

    margin-top: .7rem;
}


/* ============================================================
   SONG DETAIL
============================================================ */

.song-detail-overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: var(--overlay);

    backdrop-filter: blur(6px);

    z-index: 300;

    justify-content: center;
    align-items: center;

    padding: 2rem;
}

.song-detail-overlay.active {
    display: flex;
}

.song-detail-modal {
    background: var(--modal-bg);

    color: var(--text-color);

    border-radius: 28px;

    max-width: 720px;

    width: 100%;

    padding: 2.5rem;

    max-height: 90vh;

    overflow-y: auto;

    position: relative;

    box-shadow:
        0 20px 60px var(--strong-shadow);

    transition: .3s;
}

.close-btn {
    position: absolute;

    top: 1rem;

    right: 1.5rem;

    font-size: 2rem;

    color: var(--muted-text);

    cursor: pointer;

    border: none;

    background: none;

    transition: .2s;
}

.close-btn:hover {
    color: var(--text-color);

    transform: scale(1.1);
}

.detail-title {
    font-size: 2rem;

    font-weight: 700;

    color: var(--title-color);

    padding-right: 2rem;
}

.detail-title i {
    color: var(--primary-dark);

    margin-right: .5rem;
}

.detail-lyrics {
    font-family: Georgia, serif;

    font-size: 1.1rem;

    line-height: 1.9;

    white-space: pre-line;

    color: var(--text-color);

    margin: 1.5rem 0;

    padding: 1rem 0;

    border-top:
        2px solid var(--soft-border);

    border-bottom:
        2px solid var(--soft-border);
}

.detail-link a {
    color: var(--link-color);

    text-decoration: none;
}

.detail-link a:hover {
    text-decoration: underline;
}


/* ============================================================
   FOOTER
============================================================ */

.footer {
    background: var(--footer-bg);

    color: var(--footer-text);

    text-align: center;

    padding: 1.2rem;

    font-size: .8rem;

    margin-top: 2rem;
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:650px) {

    .header {
        flex-direction: column;

        align-items: stretch;

        gap: .8rem;
    }

    .header-controls {
        justify-content: center;
    }

    #searchInput {
        width: 100%;
        min-width: 150px;
    }

    .songs-grid {
        grid-template-columns: 1fr;
    }

    .song-detail-modal {
        padding: 1.5rem;
    }

    .admin-song-item {
        align-items: flex-start;

        gap: .7rem;

        flex-direction: column;
    }

    .admin-song-item .actions {
        width: 100%;
        justify-content: flex-start;
    }

    .detail-title {
        font-size: 1.5rem;
    }
}

</style>
</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>

    <div class="header-controls">

        <div class="search-wrap">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
                autocomplete="off"
            />

        </div>

        <span
            class="song-count"
            id="songCount"
        >
            Loading...
        </span>

        <button
            id="themeToggleBtn"
            title="Change Theme"
            aria-label="Change Theme"
        >

            <i
                class="fas fa-moon"
                id="themeIcon"
            ></i>

            <span id="themeText">
                Dark
            </span>

        </button>

        <button
            class="btn btn-outline"
            id="adminToggleBtn"
        >

            <i class="fas fa-user-shield"></i>

            Admin

        </button>

    </div>

</header>


<!-- ============================================================
     LOGIN
============================================================ -->

<div
    class="login-overlay"
    id="loginOverlay"
>

    <div class="login-modal">

        <h2>

            <i class="fas fa-lock"></i>

            Admin Login

        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin Email"
        />

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        />

        <button
            class="btn"
            id="loginBtn"
        >
            Login
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

        <p
            style="
            margin-top:1rem;
            font-size:.8rem;
            color:var(--muted-text);
            "
        >
            Login using your Supabase admin account
        </p>

    </div>

</div>


<!-- ============================================================
     SONG DETAIL
============================================================ -->

<div
    class="song-detail-overlay"
    id="songDetailOverlay"
>

    <div class="song-detail-modal">

        <button
            class="close-btn"
            id="detailCloseBtn"
        >
            &times;
        </button>

        <div
            class="detail-title"
            id="detailTitle"
        >
            Song
        </div>

        <div
            class="detail-lyrics"
            id="detailLyrics"
        ></div>

        <div
            class="detail-link"
            id="detailLink"
        ></div>

    </div>

</div>


<!-- ============================================================
     MAIN
============================================================ -->

<main class="main">

    <div
        class="admin-panel"
        id="adminPanel"
    >

        <input
            type="hidden"
            id="editingSongId"
            value=""
        />

        <h2>

            <i class="fas fa-plus-circle"></i>

            Add New Song

        </h2>

        <div class="form-group">

            <label>
                Song Title *
            </label>

            <input
                type="text"
                id="songTitle"
                placeholder="e.g. తేనెకన్న తీయనైనది"
            />

        </div>

        <div class="form-group">

            <label>
                Lyrics *
            </label>

            <textarea
                id="songLyrics"
                placeholder="Enter full lyrics..."
            ></textarea>

        </div>

        <div class="form-group">

            <label>
                Audio / YouTube Link
            </label>

            <input
                type="url"
                id="songLink"
                placeholder="https://..."
            />

        </div>

        <div class="form-group">

            <label>
                Category
            </label>

            <input
                type="text"
                id="songCategory"
                placeholder="Worship"
            />

        </div>

        <div class="form-actions">

            <button
                class="btn"
                id="addSongBtn"
            >

                <i class="fas fa-save"></i>

                Add Song

            </button>

            <button
                class="btn btn-cancel"
                id="cancelEditBtn"
                type="button"
                style="display:none;"
            >

                <i class="fas fa-times"></i>

                Cancel Edit

            </button>

        </div>

        <div
            class="status-message"
            id="formStatus"
        ></div>

        <hr
            style="
            margin:1.5rem 0;
            border:none;
            border-top:1px solid var(--border-color);
            "
        />

        <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            "
        >

            <h3>
                Existing Songs
            </h3>

            <button
                class="btn btn-danger"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

        <div
            class="admin-song-list"
            id="adminSongList"
        ></div>

    </div>


    <div
        class="songs-grid"
        id="songsGrid"
    ></div>

</main>


<!-- ============================================================
     FOOTER
============================================================ -->

<footer class="footer">

    <p>
        ✝️ Jesus Songs · Powered by Branks3
    </p>

</footer>

/* ============================================================
   TELUGU VOWELS
============================================================ */

const TELUGU_VOWELS = {

    "అ":"a",
    "ఆ":"aa",

    "ఈ":"ee",
    "ఉ":"u",
    "ఊ":"oo",

};


/* ============================================================
   VOWEL SIGNS
============================================================ */

const TELUGU_SIGNS = {

    "ా":"aa",
    "ి":"i",
    "ీ":"ee",
    "ు":"u",
    "ూ":"oo",
    "ృ":"ru",
    "ె":"e",
    "ే":"e",
    "ై":"ai",
    "ొ":"o",
    "ో":"o",
    "ౌ":"au",

    "్":"",

    "ం":"m",
    "ః":"h",
    "ఁ":"n"
};


/* ============================================================
   COMMON TELUGU WORD OVERRIDES
============================================================

   These make common Christian song words search more natural.
============================================================ */

const TELUGU_WORD_OVERRIDES = {

    "యేసు": "yesu",
    "ప్రభువు": "prabhuvu",
    "ప్రభూ": "prabhu",
    "దేవుని": "devuni",
    "దేవుడు": "devudu",

    "ప్రేమ": "prema",
    "ప్రేమించెను": "preminchenu",
    "రక్షించెను": "rakshinchenu",
    "నన్ను": "nannu",
    "నాకు": "naaku",
    "నాతోడు": "naatodu",
    "తోడు": "todu",
    "తెల్లనైనది": "tellanainadi",
    "తీయనైనది": "tiyanainadi",
    "తేనెకన్న": "tenekanna",
    "కష్టకాలమందు": "kashtakaalamandu",
    "ఆగకనే": "aagakane",
    "సాగిపోదును": "saagipodunu",
    "చూపించు": "choopinchu",
    "బాటలో": "baatalo",
    "అడ్డంకులన్ని": "addankulanni",
    "విడువకుందును": "viduvakundunu",
    "నావాళ్ళే": "naavaalle",
    "బంధువులే": "bandhuvule",
    "దూరమైనా": "dooramaina",

    "ఆనందింతును": "aanandintunu"

/* ============================================================
   SINGLE TELUGU WORD TRANSLITERATION
============================================================ */

function transliterateTeluguWord(word) {

    if (!word) {
        return "";
    }


    /*
       First check exact common-word dictionary.
    */

    if (TELUGU_WORD_OVERRIDES[word]) {

        return TELUGU_WORD_OVERRIDES[word];

    }


    let result = "";

    const chars =
        Array.from(word);


    for (let i = 0; i < chars.length; i++) {

        const char =
            chars[i];


        /*
           Handle conjuncts first.
        */

        if (
            char === "క" &&
            chars[i + 1] === "్" &&
            chars[i + 2] === "ష"
        ) {

            result += "ksha";

            i += 2;

            continue;
        }


        if (
            char === "జ" &&
            chars[i + 1] === "్" &&
            chars[i + 2] === "ఞ"
        ) {

            result += "gnya";

            i += 2;

            continue;
        }


        /*
           Independent vowel.
        */

        if (TELUGU_VOWELS[char]) {

            result +=
                TELUGU_VOWELS[char];

            continue;
        }


        /*
           Consonant.
        */

        if (TELUGU_CONSONANTS[char]) {

            let consonant =
                TELUGU_CONSONANTS[char];


            const next =
                chars[i + 1];


            /*
               If next character is a vowel sign,
               combine them.
            */

            if (
                next &&
                TELUGU_SIGNS[next] !== undefined
            ) {

                const sign =
                    TELUGU_SIGNS[next];


                /*
                   Virama means no vowel.
                */

                if (next === "్") {

                    result += consonant;

                } else {

                    result +=
                        consonant +
                        sign;

                }

                i++;

            } else {

                /*
                   Default Telugu consonant
                   has implicit "a".
                */

                result +=
                    consonant + "a";

            }

            continue;
        }


        /*
           Vowel signs appearing separately.
        */

        if (TELUGU_SIGNS[char] !== undefined) {

            result +=
                TELUGU_SIGNS[char];

            continue;
        }


        /*
           Numbers / punctuation / spaces.
        */

        result += char;
    }


    return result;
}


/* ============================================================
   FULL TEXT TELUGU TRANSLITERATION
============================================================ */

function transliterateTelugu(text) {

    if (!text) {
        return "";
    }


    let output = "";

    let currentWord = "";


    const chars =
        Array.from(text);


    function flushWord() {

        if (!currentWord) {
            return;
        }


        output +=
            transliterateTeluguWord(
                currentWord
            );


        currentWord = "";
    }


    for (const char of chars) {

        /*
           Telugu characters.
        */

        if (
            /[\u0C00-\u0C7F]/.test(char)
        ) {

            currentWord += char;

        } else {

            flushWord();

            output += char;
        }

    }


    flushWord();


    return output;
}


/* ============================================================
   SEARCH NORMALIZATION
============================================================ */

function normalizeSearchText(text) {

    if (!text) {
        return "";
    }


    return String(text)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .replace(
            /[^\p{L}\p{N}\s]/gu,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* ============================================================
   CREATE SEARCH TEXT
============================================================ */

function createSearchText(song) {

    const title =
        song.title || "";

    const lyrics =
        song.lyrics || "";

    const category =
        song.category || "";

    const artist =
        song.artist || "";


    /*
       Original Telugu / English text.
    */

    const originalText =
        [
            title,
            lyrics,
            category,
            artist
        ]
        .join(" ");


    /*
       Telugu converted to English.
    */

    const transliteratedText =
        [
            transliterateTelugu(title),
            transliterateTelugu(lyrics),
            transliterateTelugu(category),
            transliterateTelugu(artist)
        ]
        .join(" ");


    return {

        original:
            normalizeSearchText(
                originalText
            ),

        transliterated:
            normalizeSearchText(
                transliteratedText
            )

    };
}


/* ============================================================
   FUZZY WORD MATCH
============================================================ */

function levenshteinDistance(a, b) {

    if (a === b) {
        return 0;
    }


    if (!a.length) {
        return b.length;
    }


    if (!b.length) {
        return a.length;
    }


    const matrix =
        Array.from(
            { length: b.length + 1 },
            () => []
        );


    for (let i = 0; i <= b.length; i++) {

        matrix[i][0] = i;

    }


    for (let j = 0; j <= a.length; j++) {

        matrix[0][j] = j;

    }


    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            if (
                b.charAt(i - 1)
                ===
                a.charAt(j - 1)
            ) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            } else {

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1][j - 1] + 1,

                        matrix[i][j - 1] + 1,

                        matrix[i - 1][j] + 1

                    );

            }

        }

    }


    return matrix[b.length][a.length];
}


/* ============================================================
   CHECK FUZZY SEARCH
============================================================ */

function fuzzyWordExists(
    queryWord,
    textWords
) {

    if (!queryWord) {
        return false;
    }


    /*
       Exact / partial matching first.
    */

    for (const word of textWords) {

        if (
            word.includes(queryWord)
            ||
            queryWord.includes(word)
        ) {

            return true;

        }

    }


    /*
       Small spelling differences.

       Example:

       tiyanainadi
       tiyanainadi

       tenekanna
       thenekanna
    */

    if (queryWord.length < 4) {
        return false;
    }


    for (const word of textWords) {

        if (word.length < 4) {
            continue;
        }


        const distance =
            levenshteinDistance(
                queryWord,
                word
            );


        const allowed =
            queryWord.length >= 8
                ? 3
                : queryWord.length >= 6
                    ? 2
                    : 1;


        if (distance <= allowed) {

            return true;

        }

    }


    return false;
}


/* ============================================================
   SONG SEARCH MATCH
============================================================ */

function songMatchesSearch(
    song,
    query
) {

    if (!query) {
        return true;
    }


    const searchData =
        createSearchText(song);


    const normalizedQuery =
        normalizeSearchText(query);


    if (!normalizedQuery) {
        return true;
    }


    /*
       1. Direct original text match.

       This supports Telugu search.

       Example:
       తేనెకన్న
    */

    if (
        searchData.original
            .includes(normalizedQuery)
    ) {

        return true;

    }


    /*
       2. Direct transliterated text match.

       Example:
       Tenekanna
    */

    if (
        searchData.transliterated
            .includes(normalizedQuery)
    ) {

        return true;

    }


    /*
       3. Word-by-word matching.

       Example:

       "Tenekanna tiyanainadi na yesu prema"

       Each word is checked against the
       Telugu transliterated lyrics.
    */

    const queryWords =
        normalizedQuery
            .split(/\s+/)
            .filter(Boolean);


    const transliteratedWords =
        searchData.transliterated
            .split(/\s+/)
            .filter(Boolean);


    /*
       If ALL query words are found,
       return true.
    */

    const allWordsMatch =
        queryWords.every(
            queryWord =>
                fuzzyWordExists(
                    queryWord,
                    transliteratedWords
                )
        );


    if (allWordsMatch) {

        return true;

    }


    /*
       4. Check original words too.
    */

    const originalWords =
        searchData.original
            .split(/\s+/)
            .filter(Boolean);


    const originalWordsMatch =
        queryWords.every(
            queryWord =>
                fuzzyWordExists(
                    queryWord,
                    originalWords
                )
        );


    if (originalWordsMatch) {

        return true;

    }


    return false;
}


/* ============================================================
   THEME
============================================================ */

function applyTheme(theme) {

    if (theme === "dark") {

        document.body.classList.add(
            "dark-mode"
        );

        themeIcon.className =
            "fas fa-sun";

        themeText.textContent =
            "Light";

        themeToggleBtn.title =
            "Switch to Light Mode";

    } else {

        document.body.classList.remove(
            "dark-mode"
        );

        themeIcon.className =
            "fas fa-moon";

        themeText.textContent =
            "Dark";

        themeToggleBtn.title =
            "Switch to Dark Mode";

    }


    localStorage.setItem(
        "jesusSongsTheme",
        theme
    );
}


function initializeTheme() {

    const savedTheme =
        localStorage.getItem(
            "jesusSongsTheme"
        );


    if (savedTheme === "dark") {

        applyTheme("dark");

        return;

    }


    if (savedTheme === "light") {

        applyTheme("light");

        return;

    }


    const prefersDark =
        window.matchMedia &&
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches;


    if (prefersDark) {

        applyTheme("dark");

    } else {

        applyTheme("light");

    }

}


themeToggleBtn.addEventListener(
    "click",
    function() {

        const isDark =
            document.body.classList.contains(
                "dark-mode"
            );


        applyTheme(
            isDark
                ? "light"
                : "dark"
        );

    }
);


/* ============================================================
   LOAD SONGS
============================================================ */

async function loadSongs() {

    songCount.textContent =
        "Loading...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("songs")
            .select("*")
            .order("id", {
                ascending: true
            });


    if (error) {

        console.error(
            "Supabase load error:",
            error
        );


        grid.innerHTML = `

            <div class="no-results">

                <i
                    class="fas fa-exclamation-triangle"
                    style="font-size:2rem;"
                ></i>

                <p>
                    Failed to load songs.
                </p>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;


        songCount.textContent =
            "0 songs";


        return;

    }


    songs =
        data || [];


    renderSongs();

    renderAdminList();

}


/* ============================================================
   RENDER SONGS
============================================================ */

function renderSongs() {

    const q =
        searchQuery.trim();


    /*
       IMPORTANT:

       Instead of only doing:

       title.includes(q)

       we now use:

       songMatchesSearch()

       which understands Telugu + English
       transliteration.
    */

    const filtered =
        songs.filter(
            song =>
                songMatchesSearch(
                    song,
                    q
                )
        );


    songCount.textContent =
        `${filtered.length} song${filtered.length !== 1 ? "s" : ""}`;


    if (filtered.length === 0) {

        grid.innerHTML = `

            <div class="no-results">

                <i
                    class="fas fa-search"
                    style="
                    font-size:2rem;
                    opacity:.4;
                    "
                ></i>

                <p>
                    No songs found
                </p>

                <small>
                    Try Telugu or English letters
                </small>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered.map(song => {

            const preview =
                (song.lyrics || "")
                    .split("\n")
                    .filter(
                        x =>
                            x.trim() !== ""
                    )[0]
                    || "...";


            const link =
                song.audio_url || "";


            return `

                <div
                    class="song-card"
                    data-id="${song.id}"
                >

                    <div class="song-card-header">

                        <span class="song-title">

                            <i class="fas fa-music"></i>

                            ${escapeHTML(song.title)}

                        </span>

                    </div>


                    <div class="song-card-body">

                        <div class="song-preview">

                            ${escapeHTML(preview)}

                        </div>

                    </div>


                    ${
                        link
                        ?
                        `

                        <div class="song-link">

                            <a
                                href="${escapeAttribute(link)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <i
                                    class="fas fa-play-circle"
                                ></i>

                                Play / Watch

                            </a>

                        </div>

                        `
                        :
                        ""
                    }


                    <div class="song-footer">

                        <span>

                            <i class="far fa-eye"></i>

                            Tap to view full

                        </span>

                        <i
                            class="fas fa-arrow-right"
                            style="
                            color:var(--primary-dark);
                            "
                        ></i>

                    </div>

                </div>

            `;

        }).join("");

}

/* ============================================================
   LOGIN
============================================================ */

async function login() {

    const email =
        loginEmail.value.trim();

    const password =
        loginPassword.value;


    if (!email || !password) {

        loginError.textContent =
            "Please enter email and password.";

        return;

    }


    loginError.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signInWithPassword({

                email,
                password

            });


    if (error) {

        console.error(error);

        loginError.textContent =
            "❌ " + error.message;

        return;

    currentUser =
        data.user;

    alert(

    );

/* ============================================================
   ADD SONG
============================================================ */

async function addSong() {

    if (!currentUser) {

        alert(
            "Please login as admin first."
        );

        return;

    }


    const editId =
        Number(editingSongId.value);


    if (editId) {

        await updateSong(editId);

        return;

    }


    const title =
        songTitle.value.trim();


    const lyrics =
        songLyrics.value.trim();


    const link =
        songLink.value.trim();


    const category =
        songCategory.value.trim();


    if (!title || !lyrics) {

        alert(
            "Song title and lyrics are required."
        );

        return;

    }


    addSongBtn.disabled = true;


    addSongBtn.innerHTML =
        `<i class="fas fa-spinner fa-spin"></i> Saving...`;


    const {
        error
    } =
        await supabaseClient
            .from("songs")
            .insert([

                {

                    title: title,

                    artist:
                        "Jesus Songs",

                    lyrics: lyrics,

                    audio_url:
                        link || null,

                    category:
                        category ||
                        "Worship"

                }

            ]);


    addSongBtn.disabled = false;


    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;


    if (error) {

        console.error(error);


        alert(
            "❌ Failed to add song:\n" +
            error.message
        );

        return;

    }


    songTitle.value = "";

    songLyrics.value = "";

    songLink.value = "";

    songCategory.value = "";


    await loadSongs();


    alert(
        "✅ Song added to Supabase!"
    );

}


/* ============================================================
   START EDIT
============================================================ */

function startEditSong(id) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    const song =
        songs.find(
            s =>
                Number(s.id)
                ===
                Number(id)
        );


    if (!song) {

        alert(
            "Song not found."
        );

        return;

    }


    editingSongId.value =
        song.id;


    songTitle.value =
        song.title || "";


    songLyrics.value =
        song.lyrics || "";


    songLink.value =
        song.audio_url || "";


    songCategory.value =
        song.category || "";


    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Update Song`;


    cancelEditBtn.style.display =
        "inline-block";


    formStatus.textContent =
        `Editing: ${
            song.title ||
            "Untitled song"
        }`;


    formStatus.style.color =
        "#2471a3";


    renderAdminList();


    songTitle.scrollIntoView({

        behavior: "smooth",

        block: "center"

    });


    songTitle.focus();

}


/* ============================================================
   CANCEL EDIT
============================================================ */

function cancelEdit() {

    editingSongId.value = "";


    songTitle.value = "";

    songLyrics.value = "";

    songLink.value = "";

    songCategory.value = "";


    addSongBtn.disabled = false;


    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;


    cancelEditBtn.style.display =
        "none";


    formStatus.textContent = "";


    renderAdminList();

}


/* ============================================================
   UPDATE SONG
============================================================ */

async function updateSong(id) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    const title =
        songTitle.value.trim();


    const lyrics =
        songLyrics.value.trim();


    const link =
        songLink.value.trim();


    const category =
        songCategory.value.trim();


    if (!title || !lyrics) {

        alert(
            "Song title and lyrics are required."
        );

        return;

    }


    addSongBtn.disabled = true;

    cancelEditBtn.disabled = true;


    addSongBtn.innerHTML =
        `<i class="fas fa-spinner fa-spin"></i> Updating...`;


    formStatus.textContent =
        "Updating song...";


    formStatus.style.color =
        "#2471a3";


    const {
        error
    } =
        await supabaseClient
            .from("songs")
            .update({

                title: title,

                lyrics: lyrics,

                audio_url:
                    link || null,

                category:
                    category ||
                    "Worship"

            })
            .eq("id", id);


    addSongBtn.disabled = false;

    cancelEditBtn.disabled = false;


    if (error) {

        console.error(error);


        formStatus.textContent =
            "❌ Update failed: " +
            error.message;


        formStatus.style.color =
            "#c0392b";


        addSongBtn.innerHTML =
            `<i class="fas fa-save"></i> Update Song`;


        return;

    }


    cancelEdit();


    await loadSongs();


    alert(
        "✅ Song updated successfully!"
    );

}


/* ============================================================
   DELETE SONG
============================================================ */

async function deleteSong(id) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this song?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("songs")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);


        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        return;

    }


    await loadSongs();


    alert(
        "✅ Song deleted."
    );

}


/* ============================================================
   SEARCH EVENT
============================================================ */

searchInput.addEventListener(
    "input",
    function() {

        searchQuery =
            this.value;

        renderSongs();

    }
);


/* ============================================================
   ADMIN BUTTON
============================================================ */

adminToggleBtn.addEventListener(
    "click",
    async function() {

        if (currentUser) {

            await logout();

        } else {

            loginOverlay.classList.add(
                "active"
            );


            loginError.textContent =
                "";


            loginEmail.focus();

        }

    }
);


/* ============================================================
   LOGIN EVENTS
============================================================ */

loginBtn.addEventListener(
    "click",
    login
);


loginPassword.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            login();

        }

    }
);


loginEmail.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            login();

        }

    }
);


/* ============================================================
   CLOSE LOGIN
============================================================ */

loginOverlay.addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            loginOverlay.classList.remove(
                "active"
            );

        }

    }
);


/* ============================================================
   CLOSE DETAIL
============================================================ */

detailCloseBtn.addEventListener(
    "click",
    closeDetail
);


detailOverlay.addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            closeDetail();

        }

    }
);


/* ============================================================
   ESCAPE
============================================================ */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" &&
            detailOverlay.classList.contains(
                "active"
            )
        ) {

            closeDetail();

        }

    }
);


/* ============================================================
   SONG CARD CLICK
============================================================ */

grid.addEventListener(
    "click",
    function(e) {

        if (e.target.closest("a")) {

            return;

        }


        const card =
            e.target.closest(
                ".song-card"
            );


        if (!card) {
            return;
        }


        const id =
            Number(
                card.dataset.id
            );


        const song =
            songs.find(
                s =>
                    Number(s.id)
                    ===
                    id
            );


        if (song) {

            openDetail(song);

        }

    }
);


/* ============================================================
   ADD / EDIT
============================================================ */

addSongBtn.addEventListener(
    "click",
    addSong
);


cancelEditBtn.addEventListener(
    "click",
    cancelEdit
);


/* ============================================================
   LOGOUT
============================================================ */

logoutBtn.addEventListener(
    "click",
    logout
);


/* ============================================================
   SECURITY
============================================================ */

function escapeHTML(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* ============================================================
   CHECK EXISTING LOGIN
============================================================ */

async function checkUser() {

    const {
        data
    } =
        await supabaseClient.auth
            .getUser();


    if (
        data &&
        data.user
    ) {

        currentUser =
            data.user;


        adminPanel.classList.add(
            "active"
        );


        adminToggleBtn.innerHTML =
            `<i class="fas fa-user"></i> Logout`;


        adminToggleBtn.style.background =
            "#2ecc71";


        adminToggleBtn.style.color =
            "#fff";

    }

}


/* ============================================================
   START
============================================================ */

async function init() {

    initializeTheme();

    await checkUser();

    await loadSongs();

}


init();


/* ============================================================
   AUTH STATE
============================================================ */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            session &&
            session.user
        ) {

            currentUser =
                session.user;


            adminPanel.classList.add(
                "active"
            );


            adminToggleBtn.innerHTML =
                `<i class="fas fa-user"></i> Logout`;


            adminToggleBtn.style.background =
                "#2ecc71";


            adminToggleBtn.style.color =
                "#fff";


            renderAdminList();

        } else {

            currentUser = null;

            adminPanel.classList.remove(
                "active"
            );

            adminToggleBtn.innerHTML =
                `<i class="fas fa-user-shield"></i> Admin`;

            adminToggleBtn.style.background =
                "";

            adminToggleBtn.style.color =
                "";

        }

    }
);

</script>
