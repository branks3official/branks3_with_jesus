<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jesus Songs</title>

<!-- Font Awesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
/>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* ============================================================
   THEME
============================================================ */

:root {

    --body-bg:#f7f3ee;
    --body-text:#222;

    --card-bg:#fff;
    --panel-bg:#fff;
    --modal-bg:#fff;

    --header-bg-1:#1a1a2e;
    --header-bg-2:#16213e;

    --header-text:#f5e6d3;

    --primary:#f0c040;
    --primary-dark:#b8860b;

    --title-color:#1a1a2e;
    --text-color:#222;
    --muted-text:#777;
    --preview-color:#555;

    --border-color:#eee;
    --soft-border:#f0ebe5;

    --input-bg:#fff;
    --input-text:#222;
    --input-border:#ddd;

    --link-color:#1a6fb5;

    --footer-bg:#1a1a2e;
    --footer-text:rgba(255,255,255,.4);

    --shadow:rgba(0,0,0,.08);
    --strong-shadow:rgba(0,0,0,.15);

    --success:#2ecc71;

    --overlay:rgba(0,0,0,.65);
}


/* ============================================================
   DARK MODE
============================================================ */

body.dark-mode {

    --body-bg:#101114;
    --body-text:#eee;

    --card-bg:#1b1d22;
    --panel-bg:#1b1d22;
    --modal-bg:#1b1d22;

    --header-bg-1:#08090d;
    --header-bg-2:#151923;

    --title-color:#f5f5f5;
    --text-color:#eee;
    --muted-text:#aaa;
    --preview-color:#bdbdbd;

    --border-color:#30333b;
    --soft-border:#353841;

    --input-bg:#111318;
    --input-text:#eee;
    --input-border:#3b3e47;

    --link-color:#5eb7ff;

    --footer-bg:#08090d;
    --footer-text:rgba(255,255,255,.55);

    --shadow:rgba(0,0,0,.35);
    --strong-shadow:rgba(0,0,0,.55);

    --overlay:rgba(0,0,0,.78);
}


/* ============================================================
   RESET
============================================================ */

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {

    font-family:'Segoe UI',Roboto,sans-serif;

    background:var(--body-bg);
    color:var(--body-text);

    min-height:100vh;

    transition:
        background-color .3s ease,
        color .3s ease;
}


/* ============================================================
   HEADER
============================================================ */

.header {

    background:
        linear-gradient(
            135deg,
            var(--header-bg-1),
            var(--header-bg-2)
        );

    color:var(--header-text);

    padding:1.2rem 2rem;

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    justify-content:space-between;

    gap:1rem;

    box-shadow:0 4px 15px rgba(0,0,0,.3);

    position:sticky;

    top:0;

    z-index:100;
}

.header h1 {

    font-size:1.9rem;

    display:flex;

    align-items:center;

    gap:.5rem;
}

.header h1 i {

    color:var(--primary);
}

.header-controls {

    display:flex;

    align-items:center;

    gap:1rem;

    flex-wrap:wrap;
}


/* ============================================================
   SEARCH
============================================================ */

.search-wrap {

    position:relative;
}

.search-wrap i {

    position:absolute;

    left:.8rem;

    top:50%;

    transform:translateY(-50%);

    color:rgba(255,255,255,.55);

    pointer-events:none;
}

#searchInput {

    padding:.55rem 1rem .55rem 2.2rem;

    border:none;

    border-radius:30px;

    font-size:.95rem;

    background:rgba(255,255,255,.15);

    color:#fff;

    outline:2px solid transparent;

    transition:.3s;

    min-width:240px;
}

#searchInput::placeholder {

    color:rgba(255,255,255,.6);
}

#searchInput:focus {

    outline-color:var(--primary);

    background:rgba(255,255,255,.25);
}


/* ============================================================
   BUTTONS
============================================================ */

.btn {

    padding:.5rem 1.2rem;

    border:none;

    border-radius:30px;

    font-weight:600;

    font-size:.9rem;

    cursor:pointer;

    transition:.25s;

    background:var(--primary);

    color:#1a1a2e;
}

.btn:hover {

    transform:scale(1.03);

    opacity:.9;
}

.btn:disabled {

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}

.btn-outline {

    background:transparent;

    border:2px solid var(--primary);

    color:var(--primary);
}

.btn-outline:hover {

    background:var(--primary);

    color:#1a1a2e;
}

.btn-danger {

    background:#c0392b;

    color:#fff;
}

.btn-edit {

    background:#3498db;

    color:#fff;
}

.btn-edit:hover {

    background:#2980b9;
}

.btn-cancel {

    background:#777;

    color:#fff;
}


/* ============================================================
   THEME BUTTON
============================================================ */

#themeToggleBtn {

    min-width:48px;

    height:42px;

    padding:.5rem .9rem;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:.4rem;

    background:transparent;

    border:2px solid var(--primary);

    color:var(--primary);

    border-radius:30px;

    cursor:pointer;

    font-size:1rem;

    transition:.25s;
}

#themeToggleBtn:hover {

    background:var(--primary);

    color:#1a1a2e;

    transform:scale(1.05);
}


/* ============================================================
   COUNT
============================================================ */

.song-count {

    font-size:.9rem;

    color:rgba(255,255,255,.7);
}


/* ============================================================
   MAIN
============================================================ */

.main {

    max-width:1200px;

    margin:0 auto;

    padding:2rem 1.5rem;
}


/* ============================================================
   GRID
============================================================ */

.songs-grid {

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(300px,1fr)
        );

    gap:1.5rem;
}


/* ============================================================
   CARD
============================================================ */

.song-card {

    background:var(--card-bg);

    border-radius:16px;

    box-shadow:
        0 6px 20px var(--shadow);

    transition:.3s;

    border-left:
        5px solid var(--primary-dark);

    cursor:pointer;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    user-select:none;
}

.song-card:hover {

    transform:translateY(-4px);

    box-shadow:
        0 12px 30px var(--strong-shadow);
}

.song-card-header {

    padding:1.2rem 1.5rem .5rem;
}

.song-title {

    font-size:1.15rem;

    font-weight:700;

    color:var(--title-color);
}

.song-title i {

    color:var(--primary-dark);

    margin-right:.4rem;
}

.song-card-body {

    padding:0 1.5rem .8rem;

    flex:1;
}

.song-preview {

    color:var(--preview-color);

    font-style:italic;

    font-size:.9rem;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.song-link {

    padding:0 1.5rem .7rem;
}

.song-link a {

    color:var(--link-color);

    text-decoration:none;

    font-size:.9rem;
}

.song-link a:hover {

    text-decoration:underline;
}

.song-footer {

    padding:.7rem 1.5rem 1rem;

    border-top:
        1px solid var(--soft-border);

    display:flex;

    justify-content:space-between;

    font-size:.8rem;

    color:var(--muted-text);
}


/* ============================================================
   NO RESULTS
============================================================ */

.no-results {

    text-align:center;

    padding:5rem 2rem;

    grid-column:1/-1;

    color:var(--muted-text);
}

.no-results-icon {

    font-size:3.5rem;

    margin-bottom:1rem;

    color:var(--primary-dark);

    opacity:.8;
}

.no-results-title {

    font-size:1.25rem;

    font-weight:700;

    color:var(--title-color);

    margin-bottom:.5rem;
}

.no-results-text {

    font-size:.95rem;

    color:var(--muted-text);
}


/* ============================================================
   ADMIN
============================================================ */

.admin-panel {

    display:none;

    background:var(--panel-bg);

    color:var(--text-color);

    border-radius:20px;

    box-shadow:
        0 8px 30px var(--shadow);

    padding:2rem;

    margin-bottom:2rem;
}

.admin-panel.active {

    display:block;
}

.admin-panel h2,
.admin-panel h3 {

    color:var(--title-color);
}


/* ============================================================
   FORM
============================================================ */

.form-group {

    margin-bottom:1rem;
}

.form-group label {

    font-weight:600;

    display:block;

    margin-bottom:.3rem;

    color:var(--text-color);
}

.form-group input,
.form-group textarea {

    width:100%;

    padding:.7rem 1rem;

    border:
        2px solid var(--input-border);

    border-radius:8px;

    font-size:.95rem;

    font-family:inherit;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;

    transition:.25s;
}

.form-group input:focus,
.form-group textarea:focus {

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(240,192,64,.12);
}

.form-group input::placeholder,
.form-group textarea::placeholder {

    color:var(--muted-text);
}

.form-group textarea {

    min-height:140px;

    resize:vertical;
}

.form-actions {

    display:flex;

    gap:.7rem;

    flex-wrap:wrap;
}

.status-message {

    margin-top:.8rem;

    font-size:.9rem;

    min-height:1.2rem;
}


/* ============================================================
   ADMIN LIST
============================================================ */

.admin-song-list {

    margin-top:2rem;

    border-top:
        2px dashed var(--input-border);

    padding-top:1.5rem;
}

.admin-song-item {

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:.7rem 0;

    border-bottom:
        1px solid var(--border-color);

    color:var(--text-color);
}

.admin-song-item .actions {

    display:flex;

    gap:.5rem;

    flex-wrap:wrap;

    justify-content:flex-end;
}

.edit-badge {

    display:inline-block;

    margin-left:.5rem;

    padding:.2rem .55rem;

    border-radius:12px;

    background:#eaf4ff;

    color:#2471a3;

    font-size:.72rem;

    font-weight:700;
}


/* ============================================================
   LOGIN
============================================================ */

.login-overlay {

    display:none;

    position:fixed;

    inset:0;

    background:var(--overlay);

    backdrop-filter:blur(4px);

    z-index:200;

    justify-content:center;

    align-items:center;
}

.login-overlay.active {

    display:flex;
}

.login-modal {

    background:var(--modal-bg);

    color:var(--text-color);

    padding:2.5rem 2rem;

    border-radius:24px;

    max-width:380px;

    width:90%;

    box-shadow:
        0 20px 50px var(--strong-shadow);

    text-align:center;
}

.login-modal h2 {

    margin-bottom:1.5rem;

    color:var(--title-color);
}

.login-modal input {

    width:100%;

    padding:.7rem 1rem;

    margin-bottom:1rem;

    border:
        2px solid var(--input-border);

    border-radius:8px;

    font-size:1rem;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;
}

.login-modal input:focus {

    border-color:var(--primary);
}

.login-modal input::placeholder {

    color:var(--muted-text);
}

.login-modal .btn {

    width:100%;

    padding:.7rem;
}

.login-error {

    color:#e74c3c;

    font-size:.9rem;

    margin-top:.7rem;
}


/* ============================================================
   DETAIL
============================================================ */

.song-detail-overlay {

    display:none;

    position:fixed;

    inset:0;

    background:var(--overlay);

    backdrop-filter:blur(6px);

    z-index:300;

    justify-content:center;

    align-items:center;

    padding:2rem;
}

.song-detail-overlay.active {

    display:flex;
}

.song-detail-modal {

    background:var(--modal-bg);

    color:var(--text-color);

    border-radius:28px;

    max-width:720px;

    width:100%;

    padding:2.5rem;

    max-height:90vh;

    overflow-y:auto;

    position:relative;

    box-shadow:
        0 20px 60px var(--strong-shadow);
}

.close-btn {

    position:absolute;

    top:1rem;

    right:1.5rem;

    font-size:2rem;

    color:var(--muted-text);

    cursor:pointer;

    border:none;

    background:none;
}

.close-btn:hover {

    color:var(--text-color);

    transform:scale(1.1);
}

.detail-title {

    font-size:2rem;

    font-weight:700;

    color:var(--title-color);

    padding-right:2rem;
}

.detail-title i {

    color:var(--primary-dark);

    margin-right:.5rem;
}

.detail-lyrics {

    font-family:Georgia,serif;

    font-size:1.1rem;

    line-height:1.9;

    white-space:pre-line;

    color:var(--text-color);

    margin:1.5rem 0;

    padding:1rem 0;

    border-top:
        2px solid var(--soft-border);

    border-bottom:
        2px solid var(--soft-border);
}

.detail-link a {

    color:var(--link-color);

    text-decoration:none;
}


/* ============================================================
   FOOTER
============================================================ */

.footer {

    background:var(--footer-bg);

    color:var(--footer-text);

    text-align:center;

    padding:1.2rem;

    font-size:.8rem;

    margin-top:2rem;
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:650px) {

    .header {

        flex-direction:column;

        align-items:stretch;
    }

    .header-controls {

        justify-content:center;
    }

    #searchInput {

        width:100%;

        min-width:150px;
    }

    .songs-grid {

        grid-template-columns:1fr;
    }

    .song-detail-modal {

        padding:1.5rem;
    }

    .admin-song-item {

        align-items:flex-start;

        gap:.7rem;

        flex-direction:column;
    }

    .admin-song-item .actions {

        width:100%;

        justify-content:flex-start;
    }

    .detail-title {

        font-size:1.5rem;
    }

}

</style>
</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>


    <div class="header-controls">


        <div class="search-wrap">

            <i class="fas fa-search"></i>

        <div

        <div
            class="detail-link"

    </div>

</div>


<!-- ============================================================
     MAIN
============================================================ -->

<main class="main">


    <!-- ADMIN PANEL -->

    <div
        class="admin-panel"
        id="adminPanel"
    >

        <input
            type="hidden"
            id="editingSongId"
            value=""
        >


        <h2>

            <i class="fas fa-plus-circle"></i>

            Add New Song

        </h2>


        <div class="form-group">

            <label>Song Title *</label>

            <input
                type="text"
                id="songTitle"
                placeholder="e.g. Amazing Grace"
            >

        </div>


        <div class="form-group">

            <label>Lyrics *</label>

            <textarea
                id="songLyrics"
                placeholder="Enter full lyrics..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>Audio / YouTube Link</label>

            <input
                type="url"
                id="songLink"
                placeholder="https://..."
            >

        </div>


        <div class="form-group">

            <label>Category</label>

            <input
                type="text"
                id="songCategory"

        </div>


        <div class="form-actions">

                class="btn"

                <i class="fas fa-save"></i>

            <button
                class="btn btn-cancel"
                id="cancelEditBtn"
                type="button"
                style="display:none;"
            >

                <i class="fas fa-times"></i>

                Cancel Edit

            </button>

        </div>


        <div
            class="status-message"
            id="formStatus"
        ></div>


        <hr
            style="
            margin:1.5rem 0;
            border:none;
            border-top:1px solid var(--border-color);
            "
        >


        <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            "
        >

            <h3>
                Existing Songs
            </h3>


            <button
                class="btn btn-danger"
                id="logoutBtn"
            >

                Logout

            </button>

        </div>


        <div
            class="admin-song-list"
            id="adminSongList"
        ></div>

    </div>


    <!-- PUBLIC SONGS -->

    <div
        class="songs-grid"
        id="songsGrid"
    ></div>

</main>


<!-- ============================================================
     FOOTER
============================================================ -->

<footer class="footer">

    <p>
        ✝️ Jesus Songs · Powered by Branks3
    </p>

</footer>



<script>

/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://jxbjjbmwlqjfonnuhjrx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_D9ppxxYrbWMUsMxTnxdnhA_hQORxcXH";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ============================================================
   STATE
============================================================ */

let songs = [];

let searchQuery = "";

let currentUser = null;


/* ============================================================
   DOM
============================================================ */

const grid =
    document.getElementById("songsGrid");

const searchInput =
    document.getElementById("searchInput");

const songCount =
    document.getElementById("songCount");

const adminPanel =
    document.getElementById("adminPanel");

const adminToggleBtn =
    document.getElementById("adminToggleBtn");

const loginOverlay =
    document.getElementById("loginOverlay");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const addSongBtn =
    document.getElementById("addSongBtn");

const cancelEditBtn =
    document.getElementById("cancelEditBtn");

const editingSongId =
    document.getElementById("editingSongId");

const formStatus =
    document.getElementById("formStatus");

const songTitle =
    document.getElementById("songTitle");

const songLyrics =
    document.getElementById("songLyrics");

const songLink =
    document.getElementById("songLink");

const songCategory =
    document.getElementById("songCategory");

const adminSongList =
    document.getElementById("adminSongList");

const detailOverlay =
    document.getElementById("songDetailOverlay");

const detailCloseBtn =
    document.getElementById("detailCloseBtn");

const detailTitle =
    document.getElementById("detailTitle");

const detailLyrics =
    document.getElementById("detailLyrics");

const detailLink =
    document.getElementById("detailLink");


/* ============================================================
   THEME
============================================================ */

const themeToggleBtn =
    document.getElementById("themeToggleBtn");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme) {

    if (theme === "dark") {

        document.body.classList.add("dark-mode");

        themeIcon.className =
            "fas fa-sun";

        themeText.textContent =
            "Light";

        themeToggleBtn.title =
            "Switch to Light Mode";

    } else {

        document.body.classList.remove("dark-mode");

        themeIcon.className =
            "fas fa-moon";

        themeText.textContent =
            "Dark";

        themeToggleBtn.title =
            "Switch to Dark Mode";
    }


    localStorage.setItem(
        "jesusSongsTheme",
        theme
    );
}


function initializeTheme() {

    const saved =
        localStorage.getItem(
            "jesusSongsTheme"
        );


    if (saved === "dark") {

        applyTheme("dark");

        return;
    }


    if (saved === "light") {

        applyTheme("light");

        return;
    }


    const prefersDark =
        window.matchMedia &&
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches;


    applyTheme(
        prefersDark

/* ============================================================
   TELUGU TRANSLITERATION
   ------------------------------------------------------------
   IMPORTANT:
   This is improved for Roman Telugu search.
============================================================ */


/*
   Independent vowels
*/

const TELUGU_VOWELS = {

    "అ":"a",
    "ఆ":"aa",
    "ఇ":"i",
    "ఈ":"ii",
    "ఉ":"u",
    "ఊ":"uu",
    "ఋ":"ru",
    "ౠ":"ruu",
    "ఎ":"e",
    "ఏ":"ee",
    "ఐ":"ai",
    "ఒ":"o",
    "ఓ":"oo",
    "ఔ":"au"

};


/*
   Consonants
*/

const TELUGU_CONSONANTS = {

    "క":"k",
    "ఖ":"kh",
    "గ":"g",
    "ఘ":"gh",
    "ఙ":"ng",

    "చ":"ch",
    "ఛ":"chh",
    "జ":"j",
    "ఝ":"jh",
    "ఞ":"ny",

    "ట":"t",
    "ఠ":"th",
    "డ":"d",
    "ఢ":"dh",
    "ణ":"n",

    "త":"t",
    "థ":"th",
    "ద":"d",
    "ధ":"dh",
    "న":"n",

    "ప":"p",
    "ఫ":"ph",
    "బ":"b",
    "భ":"bh",
    "మ":"m",

    "య":"y",
    "ర":"r",
    "ల":"l",
    "వ":"v",

    "శ":"sh",
    "ష":"sh",
    "స":"s",
    "హ":"h",

    "ళ":"l",
    "ఱ":"r",

    "క్ష":"ksha"

};


/*
   Vowel signs
*/

const TELUGU_SIGNS = {

    "ా":"aa",
    "ి":"i",
    "ీ":"ii",
    "ు":"u",
    "ూ":"uu",
    "ృ":"ru",
    "ౄ":"ruu",
    "ె":"e",
    "ే":"ee",
    "ై":"ai",
    "ొ":"o",
    "ో":"oo",
    "ౌ":"au"

};


/*
   Special
*/

const TELUGU_SPECIAL = {

    "ం":"m",
    "ః":"h",
    "ఁ":"m"

};


/*
   Telugu → Roman Telugu
*/

function transliterateTelugu(text) {

    if (!text) {
        return "";
    }


    const chars =
        Array.from(
            String(text)
        );


    let result = "";


    for (
        let i = 0;
        i < chars.length;
        i++
    ) {

        const char =
            chars[i];


        /*
           Independent vowel
        */

        if (
            TELUGU_VOWELS[char]
        ) {

            result +=
                TELUGU_VOWELS[char];

            continue;
        }


        /*
           Special
        */

        if (
            TELUGU_SPECIAL[char]
        ) {

            result +=
                TELUGU_SPECIAL[char];

            continue;
        }


        /*
           Virama
        */

        if (char === "్") {

            continue;
        }


        /*
           Conjunct "క్ష"
        */

        if (
            char === "క" &&
            chars[i + 1] === "్" &&
            chars[i + 2] === "ష"
        ) {

            result += "ksha";

            i += 2;

            continue;
        }


        /*
           Normal consonant
        */

        if (
            TELUGU_CONSONANTS[char]
        ) {

            const consonant =
                TELUGU_CONSONANTS[char];


            const next =
                chars[i + 1];


            /*
               Vowel sign
            */

            if (
                next &&
                TELUGU_SIGNS[next]
            ) {

                result +=
                    consonant +
                    TELUGU_SIGNS[next];

                i++;

                continue;
            }


            /*
               Virama
            */

            if (
                next === "్"
            ) {

                result +=
                    consonant;

                i++;

                continue;
            }


            /*
               Default Telugu vowel = a
            */

            result +=
                consonant + "a";

            continue;
        }


        /*
           Everything else
        */

        result += char;

    }


    return result;

}


/* ============================================================
   SEARCH NORMALIZATION
============================================================ */


/*
   Basic text cleanup
*/

function normalizeBasic(text) {

    return String(text ?? "")

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[’'`]/g,
            ""
        )

        .replace(
            /[^a-z0-9\u0C00-\u0C7F]+/gi,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/*
   Roman Telugu canonical form.

   Example:

   amma
   ammaa
   aamaa
   ammmaa

   become much easier to compare.
*/

function canonicalRoman(text) {

    let value =
        normalizeBasic(text);


    /*
       Common phonetic replacements
    */

    value =
        value

        .replace(/aa+/g, "a")
        .replace(/ee+/g, "i")
        .replace(/ii+/g, "i")
        .replace(/oo+/g, "o")
        .replace(/uu+/g, "u")

        .replace(/chh/g, "ch")
        .replace(/kh/g, "k")
        .replace(/gh/g, "g")
        .replace(/jh/g, "j")
        .replace(/dh/g, "d")
        .replace(/bh/g, "b")
        .replace(/ph/g, "p")
        .replace(/th/g, "t")

        .replace(/sh/g, "s")

        .replace(/zh/g, "j");


    /*
       Telugu typing commonly uses
       "ee" / "e", "oo" / "o"
    */

    value =
        value
        .replace(/e+/g, "e")
        .replace(/i+/g, "i")
        .replace(/o+/g, "o")
        .replace(/u+/g, "u");


    /*
       Remove duplicate consonants.

       Example:
       amma → ama
       rammaa → rama
    */

    value =
        value.replace(
            /([bcdfghjklmnpqrstvwxyz])\1+/g,
            "$1"
        );


    return value;

}


/*
   Convert text into searchable form.
*/

function buildSearchVariants(text) {

    const original =
        normalizeBasic(text);


    const teluguRoman =
        canonicalRoman(
            transliterateTelugu(text)
        );


    const directRoman =
        canonicalRoman(text);


    return [

        original,

        teluguRoman,

        directRoman

    ]

        .filter(Boolean)

        .join(" ");

}


/* ============================================================
   SEARCH DATA
============================================================ */

function createSongSearchData(song) {

    const title =
        song.title || "";

    const lyrics =
        song.lyrics || "";

    const category =
        song.category || "";

    const artist =
        song.artist || "";


    const fullText =
        [
            title,
            lyrics,
            category,
            artist
        ].join(" ");


    return {

        raw:
            normalizeBasic(fullText),

        searchable:
            buildSearchVariants(fullText),

        title:
            buildSearchVariants(title),

        lyrics:
            buildSearchVariants(lyrics),

        category:
            buildSearchVariants(category),

        artist:
            buildSearchVariants(artist)

    };

}


/* ============================================================
   SEARCH TOKENIZATION
============================================================ */

function getSearchTokens(query) {

    const raw =
        normalizeBasic(query);


    if (!raw) {
        return [];
    }


    return raw
        .split(/\s+/)
        .filter(Boolean);

}


/* ============================================================
   SEARCH WORD VARIANTS
============================================================ */

function getWordVariants(word) {

    const original =
        normalizeBasic(word);


    const romanFromTelugu =
        canonicalRoman(
            transliterateTelugu(word)
        );


    const directRoman =
        canonicalRoman(word);


    const variants = new Set();


    if (original) {
        variants.add(original);
    }


    if (romanFromTelugu) {
        variants.add(romanFromTelugu);
    }


    if (directRoman) {
        variants.add(directRoman);
    }


    /*
       Add direct simplified versions
    */

    for (
        const value of Array.from(variants)
    ) {

        variants.add(
            canonicalRoman(value)
        );

    }


    return Array.from(
        variants
    ).filter(Boolean);

}


/* ============================================================
   SEARCH MATCH
============================================================ */

function songMatchesSearch(song, query) {

    if (!query || !query.trim()) {

        return true;

    }


    const tokens =
        getSearchTokens(query);


    if (!tokens.length) {

        return true;

    }


    const data =
        createSongSearchData(song);


    /*
       Every word typed by user must
       match somewhere in the song.
    */

    return tokens.every(token => {

        const variants =
            getWordVariants(token);


        return variants.some(variant => {

            /*
               Exact searchable substring
            */

            if (
                data.searchable.includes(
                    variant
                )
            ) {

                return true;

            }


            /*
               Title match
            */

            if (
                data.title.includes(
                    variant
                )
            ) {

                return true;

            }


            /*
               Lyrics match
            */

            if (
                data.lyrics.includes(
                    variant
                )
            ) {

                return true;

            }


            /*
               Category match
            */

            if (
                data.category.includes(
                    variant
                )
            ) {

                return true;

            }


            /*
               Artist match
            */

            if (
                data.artist.includes(
                    variant
                )
            ) {

                return true;

            }


            return false;

        });

    });

}

async function loadSongs() {

    songCount.textContent =
        "Loading...";


    const {
        data,
        error
    } =
        await supabaseClient

            .from("songs")

            .select("*")

            .order(
                "id",
                {
                    ascending:true
                }
            );


    if (error) {

        console.error(
            "Supabase Error:",
            error
        );


        grid.innerHTML = `

            <div class="no-results">

                <div class="no-results-icon">

                    <i class="fas fa-exclamation-triangle"></i>

                </div>

                <div class="no-results-title">

                    Unable to load songs

                </div>

                <div class="no-results-text">

                    Please try again later.

                </div>

            </div>

        `;


        songCount.textContent =
            "0 songs";


        return;

    }


    songs =
        Array.isArray(data)
            ? data
            : [];


    renderSongs();

    renderAdminList();

}


/* ============================================================
   RENDER SONGS
============================================================ */

function renderSongs() {

    /*
       Database empty
    */

    if (!songs.length) {

        songCount.textContent =
            "0 songs";


        grid.innerHTML = `

            <div class="no-results">

                <div class="no-results-icon">

                    <i class="fas fa-music"></i>

                </div>

                <div class="no-results-title">

                    No data found

                </div>

                <div class="no-results-text">

                    Admin hasn't added any songs yet.

                </div>

            </div>

        `;

        return;

    }


    const q =
        searchQuery.trim();


    const filtered =
        songs.filter(song =>
            songMatchesSearch(
                song,
                q
            )
        );


    songCount.textContent =
        `${filtered.length} song${
            filtered.length !== 1
                ? "s"
                : ""
        }`;


    /*
       No match
    */

    if (!filtered.length) {

        grid.innerHTML = `

            <div class="no-results">

                <div class="no-results-icon">

                    <i class="fas fa-search"></i>

                </div>

                <div class="no-results-title">

                    No matching songs found

                </div>

                <div class="no-results-text">

                    Try English, Roman Telugu or Telugu words.

                </div>

            </div>

        `;

        return;

    }


    /*
       Render cards
    */

    grid.innerHTML =
        filtered.map(song => {

            const preview =
                (song.lyrics || "")

                    .split("\n")

                    .map(x => x.trim())

                    .find(Boolean)

                    || "...";


            const link =
                song.audio_url || "";


            return `

                <div
                    class="song-card"
                    data-id="${escapeAttribute(song.id)}"
                >

                    <div class="song-card-header">

                        <span class="song-title">

                            <i class="fas fa-music"></i>

                            ${escapeHTML(
                                song.title
                            )}

                        </span>

                    </div>


                    <div class="song-card-body">

                        <div class="song-preview">

                            ${escapeHTML(
                                preview
                            )}

                        </div>

                    </div>


                    ${
                        link
                        ?
                        `

                        <div class="song-link">

                            <a
                                href="${escapeAttribute(link)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <i class="fas fa-play-circle"></i>

                                Play / Watch

                            </a>

                        </div>

                        `
                        :
                        ""
                    }


                    <div class="song-footer">

                        <span>

                            <i class="far fa-eye"></i>

                            Tap to view full

                        </span>


                        <i
                            class="fas fa-arrow-right"
                            style="color:var(--primary-dark);"
                        ></i>

                    </div>

                </div>

            `;

        }).join("");

}

async function login() {

        loginPassword.value;

            "Please enter email and password.";

        "Logging in...";

    } =

                email,
                password

            });

    loginPassword.value = "";

}

/* ============================================================
   ADD SONG
============================================================ */

async function addSong() {

    if (!currentUser) {

        alert(
            "Please login as admin first."
        );

        return;

    }


    const editId =
        Number(
            editingSongId.value
        );


    if (editId) {

        await updateSong(editId);

        return;

    }


    const title =
        songTitle.value.trim();

    const lyrics =
        songLyrics.value.trim();

    const link =
        songLink.value.trim();

    const category =
        songCategory.value.trim();


    if (!title || !lyrics) {

        alert(
            "Song title and lyrics are required."
        );

        return;

    }


    addSongBtn.disabled = true;


    addSongBtn.innerHTML =
        `<i class="fas fa-spinner fa-spin"></i> Saving...`;


    const {
        error
    } =
        await supabaseClient

            .from("songs")

            .insert([{

                title:title,

                artist:"Jesus Songs",

                lyrics:lyrics,

                audio_url:
                    link || null,

                category:
                    category || "Worship"

            }]);


    addSongBtn.disabled = false;


    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;


    if (error) {

        console.error(error);

        alert(
            "❌ Failed to add song:\n\n" +
            error.message
        );

        return;

    }


    songTitle.value = "";

    songLyrics.value = "";

    songLink.value = "";

    songCategory.value = "";


    await loadSongs();


    alert(
        "✅ Song added successfully!"
    );

}


/* ============================================================
   EDIT
============================================================ */

function startEditSong(id) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    const song =
        songs.find(
            s =>
                Number(s.id)
                === Number(id)
        );


    if (!song) {

        alert(
            "Song not found."
        );

        return;

    }


    editingSongId.value =
        song.id;


    songTitle.value =
        song.title || "";

    songLyrics.value =
        song.lyrics || "";

    songLink.value =
        song.audio_url || "";

    songCategory.value =
        song.category || "";


    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Update Song`;


    cancelEditBtn.style.display =
        "inline-block";


    formStatus.textContent =
        `Editing: ${
            song.title || "Untitled song"
        }`;


    formStatus.style.color =
        "#2471a3";


    renderAdminList();


    songTitle.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });


    songTitle.focus();

}


/* ============================================================
   CANCEL EDIT
============================================================ */

function cancelEdit() {

    editingSongId.value = "";

    songTitle.value = "";

    songLyrics.value = "";

    songLink.value = "";

    songCategory.value = "";


    addSongBtn.disabled = false;


    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;

    cancelEditBtn.style.display =
        "none";

}


/* ============================================================
   UPDATE
============================================================ */

async function updateSong(id) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    const title =
        songTitle.value.trim();

    const lyrics =
        songLyrics.value.trim();

    const link =
        songLink.value.trim();

    const category =
        songCategory.value.trim();


    if (!title || !lyrics) {

        alert(
            "Song title and lyrics are required."
        );

        return;

    }


    addSongBtn.disabled = true;

    cancelEditBtn.disabled = true;


    addSongBtn.innerHTML =
        `<i class="fas fa-spinner fa-spin"></i> Updating...`;


    const {
        error
    } =
        await supabaseClient

            .from("songs")

            .update({

                title:title,

                lyrics:lyrics,

                audio_url:
                    link || null,

                category:
                    category || "Worship"

            })

            .eq(
                "id",
                id
            );


    addSongBtn.disabled = false;

    cancelEditBtn.disabled = false;


    if (error) {

        console.error(error);

        formStatus.textContent =
            "❌ Update failed: " +
            error.message;

        formStatus.style.color =
            "#c0392b";


        addSongBtn.innerHTML =
            `<i class="fas fa-save"></i> Update Song`;

        return;

    }


    cancelEdit();

    await loadSongs();


    alert(
        "✅ Song updated successfully!"
    );

}


/* ============================================================
   DELETE
============================================================ */

async function deleteSong(id) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this song?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
        await supabaseClient

            .from("songs")

            .delete()

            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "❌ Delete failed:\n\n" +
            error.message
        );

        return;

    }


    if (
        Number(editingSongId.value)
        === Number(id)
    ) {

        cancelEdit();

    }


    await loadSongs();


    alert(
        "✅ Song deleted successfully."
    );

}


/* ============================================================
   SEARCH
============================================================ */

searchInput.addEventListener(
    "input",
    function() {

        searchQuery =
            this.value;


        renderSongs();

    }
);


/* ============================================================
   ADMIN
============================================================ */

adminToggleBtn.addEventListener(
    "click",
    async function() {

        if (currentUser) {

            await logout();

            return;

        }


        loginOverlay.classList.add(
            "active"
        );


        loginError.textContent =
            "";


        loginEmail.focus();

    }
);


/* ============================================================
   LOGIN EVENTS
============================================================ */

loginBtn.addEventListener(
    "click",
    login
);


loginPassword.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter") {

            login();

        }

    }
);


loginEmail.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter") {

            login();

        }

    }
);


/* ============================================================
   CLOSE LOGIN
============================================================ */

loginOverlay.addEventListener(
    "click",
    e => {

        if (e.target === loginOverlay) {

            loginOverlay.classList.remove(
                "active"
            );

        }

    }
);


/* ============================================================
   CLOSE DETAIL
============================================================ */

detailCloseBtn.addEventListener(
    "click",
    closeDetail
);


detailOverlay.addEventListener(
    "click",
    e => {

        if (e.target === detailOverlay) {

            closeDetail();

        }

    }
);


/* ============================================================
   ESC
============================================================ */

document.addEventListener(
    "keydown",
    e => {

        if (e.key !== "Escape") {
            return;
        }


        if (
            detailOverlay.classList.contains(
                "active"
            )
        ) {

            closeDetail();

        }


        if (
            loginOverlay.classList.contains(
                "active"
            )
        ) {

            loginOverlay.classList.remove(
                "active"
            );

        }

    }
);


/* ============================================================
   SONG CARD CLICK
============================================================ */

grid.addEventListener(
    "click",
    e => {

        if (e.target.closest("a")) {

            return;

        }


        const card =
            e.target.closest(
                ".song-card"
            );


        if (!card) {

            return;

        }


        const id =
            Number(
                card.dataset.id
            );


        const song =
            songs.find(
                s =>
                    Number(s.id)
                    === id
            );


        if (song) {

            openDetail(song);

        }

    }
);


/* ============================================================
   ADD / EDIT
============================================================ */

addSongBtn.addEventListener(
    "click",
    addSong
);


cancelEditBtn.addEventListener(
    "click",
    cancelEdit
);


/* ============================================================
   LOGOUT
============================================================ */

logoutBtn.addEventListener(
    "click",
    logout
);


/* ============================================================
   SECURITY
============================================================ */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* ============================================================
   CHECK USER
============================================================ */

async function checkUser() {

    const {
        data
    } =
        await supabaseClient.auth
            .getUser();


    if (
        data &&
        data.user
    ) {

        currentUser =
            data.user;


        adminPanel.classList.add(
            "active"
        );


        setAdminButton();

    }

}


/* ============================================================
   INIT
============================================================ */

async function init() {

    initializeTheme();

    await checkUser();

    await loadSongs();

}


init();


/* ============================================================
   AUTH STATE
============================================================ */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            session &&
            session.user
        ) {

            currentUser =
                session.user;


            adminPanel.classList.add(
                "active"
            );


            setAdminButton();


            renderAdminList();

        } else {

            currentUser = null;


            adminPanel.classList.remove(
                "active"
            );


            resetAdminButton();

        }

    }
);

</script>

</body>
</html>
